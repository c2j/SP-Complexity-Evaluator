<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反馈查看器 - SQL复杂度评估</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        h1 i {
            margin-right: 10px;
            color: #4CAF50;
        }
        .feedback-list {
            margin-top: 20px;
        }
        .feedback-item {
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 15px;
            background-color: #fff;
        }
        .feedback-header {
            padding: 10px 15px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .feedback-header h3 {
            margin: 0;
            font-size: 16px;
        }
        .feedback-meta {
            font-size: 14px;
            color: #666;
        }
        .feedback-content {
            padding: 15px;
            display: none;
        }
        .feedback-content.active {
            display: block;
        }
        .feedback-field {
            margin-bottom: 10px;
        }
        .feedback-field strong {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        .file-content {
            background-color: #f8f8f8;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            margin-top: 10px;
            border: 1px solid #ddd;
            white-space: pre-wrap;
            font-family: monospace;
            position: relative;
        }
        .file-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        .file-action-btn {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 4px;
            color: #333;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }
        .file-action-btn:hover {
            background-color: #e0e0e0;
        }
        .file-action-btn i {
            margin-right: 5px;
        }
        .preview-container {
            margin-top: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
            display: none;
        }
        .preview-container.active {
            display: block;
        }
        .preview-header {
            background-color: #f0f0f0;
            padding: 8px 15px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .preview-header h4 {
            margin: 0;
            font-size: 14px;
        }
        .preview-header .close-btn {
            cursor: pointer;
            color: #666;
        }
        .preview-header .close-btn:hover {
            color: #333;
        }
        .preview-content {
            padding: 15px;
            max-height: 400px;
            overflow: auto;
        }
        .preview-content pre {
            margin: 0;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .preview-content img {
            max-width: 100%;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4CAF50;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #666;
        }
        .no-feedback {
            text-align: center;
            padding: 20px;
            color: #666;
            font-style: italic;
        }
        .toggle-icon {
            transition: transform 0.3s;
        }
        .feedback-header.active .toggle-icon {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-comments"></i> 反馈查看器</h1>
        <p>查看用户提交的关于SQL复杂度评估的反馈。</p>

        <div id="feedbackList" class="feedback-list">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i> 正在加载反馈...
            </div>
        </div>

        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回主页</a>
    </div>

    <script>
        // 加载所有反馈
        function loadFeedback() {
            fetch('/api/feedback')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('获取反馈失败');
                    }
                    return response.json();
                })
                .then(data => {
                    displayFeedback(data);
                })
                .catch(error => {
                    document.getElementById('feedbackList').innerHTML = `
                        <div class="no-feedback">
                            <i class="fas fa-exclamation-circle"></i> 加载反馈时出错: ${error.message}
                        </div>
                    `;
                });
        }

        // 显示反馈列表
        function displayFeedback(feedbackEntries) {
            const feedbackList = document.getElementById('feedbackList');

            if (!feedbackEntries || feedbackEntries.length === 0) {
                feedbackList.innerHTML = `
                    <div class="no-feedback">
                        <i class="fas fa-info-circle"></i> 暂无反馈
                    </div>
                `;
                return;
            }

            // 按时间倒序排序
            feedbackEntries.sort((a, b) => {
                return new Date(b.timestamp) - new Date(a.timestamp);
            });

            let html = '';

            feedbackEntries.forEach((feedback, index) => {
                const timestamp = new Date(feedback.timestamp).toLocaleString();
                const feedbackId = `feedback-${index}`;

                // Handle both old and new field names
                const description = feedback.contentDescription || feedback.content || '无描述';
                const fileName = feedback.originalFilename || '未知';

                html += `
                    <div class="feedback-item">
                        <div class="feedback-header" onclick="toggleFeedback('${feedbackId}')">
                            <h3>${feedback.feedbackType} - ${description}</h3>
                            <div class="feedback-meta">
                                <span>${timestamp}</span>
                                <i class="fas fa-chevron-down toggle-icon"></i>
                            </div>
                        </div>
                        <div id="${feedbackId}" class="feedback-content">
                            <div class="feedback-field">
                                <strong>反馈类型:</strong> ${feedback.feedbackType}
                            </div>
                            <div class="feedback-field">
                                <strong>内容描述:</strong> ${description}
                            </div>
                            <div class="feedback-field">
                                <strong>SQL方言:</strong> ${feedback.dialect}
                            </div>
                            <div class="feedback-field">
                                <strong>提交时间:</strong> ${timestamp}
                            </div>
                            <div class="feedback-field">
                                <strong>原始文件名:</strong> ${fileName}
                            </div>
                            <div class="feedback-field">
                                <strong>问题描述:</strong> ${feedback.comments}
                            </div>
                            ${feedback.contactPerson ? `
                            <div class="feedback-field">
                                <strong>联系人:</strong> ${feedback.contactPerson}
                            </div>` : ''}
                            ${feedback.contactInfo ? `
                            <div class="feedback-field">
                                <strong>联系方式:</strong> ${feedback.contactInfo}
                            </div>` : ''}
                            <div class="feedback-field">
                                <strong>文件内容:</strong>
                                <div id="file-content-${index}" class="file-content">
                                    <i class="fas fa-spinner fa-spin"></i> 正在加载文件内容...
                                </div>
                                <div class="file-actions">
                                    <a href="javascript:void(0)" class="file-action-btn preview-btn" onclick="previewFile(${index})">
                                        <i class="fas fa-eye"></i> 预览
                                    </a>
                                    <a href="javascript:void(0)" class="file-action-btn download-btn" onclick="downloadFile('${feedback.filePath}', '${feedback.originalFilename || ''}')">
                                        <i class="fas fa-download"></i> 下载
                                    </a>
                                </div>
                                <div id="preview-container-${index}" class="preview-container">
                                    <div class="preview-header">
                                        <h4>文件预览: ${feedback.originalFilename || '未知文件'}</h4>
                                        <span class="close-btn" onclick="closePreview(${index})"><i class="fas fa-times"></i></span>
                                    </div>
                                    <div class="preview-content">
                                        <pre id="preview-content-${index}"></pre>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            feedbackList.innerHTML = html;

            // 加载第一个反馈的文件内容
            if (feedbackEntries.length > 0) {
                loadFileContent(feedbackEntries[0], 0);
            }
        }

        // 切换显示/隐藏反馈详情
        function toggleFeedback(id) {
            const content = document.getElementById(id);
            const header = content.previousElementSibling;

            if (content.classList.contains('active')) {
                content.classList.remove('active');
                header.classList.remove('active');
            } else {
                content.classList.add('active');
                header.classList.add('active');

                // 加载文件内容
                const index = id.split('-')[1];
                const feedbackEntries = window.feedbackData;
                if (feedbackEntries && feedbackEntries[index]) {
                    loadFileContent(feedbackEntries[index], index);
                }
            }
        }

        // 加载文件内容
        function loadFileContent(feedback, index) {
            // Handle old feedback entries that might not have filePath
            if (!feedback.filePath) {
                // Check if it has the old "content" field or the new "contentDescription" field
                if (feedback.content) {
                    document.getElementById(`file-content-${index}`).textContent = feedback.content;
                } else {
                    document.getElementById(`file-content-${index}`).textContent =
                        feedback.contentDescription ?
                        `内容描述: ${feedback.contentDescription}` :
                        '无文件内容';
                }
                return;
            }

            fetch(`/api/feedback/file?path=${encodeURIComponent(feedback.filePath)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('获取文件内容失败');
                    }
                    return response.text();
                })
                .then(content => {
                    document.getElementById(`file-content-${index}`).textContent = content;
                })
                .catch(error => {
                    // If file not found, show a more user-friendly message
                    if (error.message.includes('404') || error.message.includes('not found')) {
                        document.getElementById(`file-content-${index}`).textContent =
                            `文件未找到。可能已被移动或删除。\n文件路径: ${feedback.filePath}`;
                    } else {
                        document.getElementById(`file-content-${index}`).textContent =
                            `加载文件内容出错: ${error.message}`;
                    }
                });
        }

        // 预览文件
        function previewFile(index) {
            const feedback = window.feedbackData[index];
            const previewContainer = document.getElementById(`preview-container-${index}`);
            const previewContent = document.getElementById(`preview-content-${index}`);

            // If already loaded, just toggle visibility
            if (previewContainer.classList.contains('active')) {
                previewContainer.classList.remove('active');
                return;
            }

            // Show the preview container
            previewContainer.classList.add('active');

            // If no file path, show a message
            if (!feedback.filePath) {
                if (feedback.content) {
                    previewContent.textContent = feedback.content;
                } else {
                    previewContent.textContent = feedback.contentDescription ?
                        `内容描述: ${feedback.contentDescription}` :
                        '无文件内容';
                }
                return;
            }

            // Show loading indicator
            previewContent.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在加载文件内容...';

            // Fetch the file content
            fetch(`/api/feedback/file?path=${encodeURIComponent(feedback.filePath)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('获取文件内容失败');
                    }
                    return response.text();
                })
                .then(content => {
                    previewContent.textContent = content;
                })
                .catch(error => {
                    if (error.message.includes('404') || error.message.includes('not found')) {
                        previewContent.textContent = `文件未找到。可能已被移动或删除。\n文件路径: ${feedback.filePath}`;
                    } else {
                        previewContent.textContent = `加载文件内容出错: ${error.message}`;
                    }
                });
        }

        // 关闭预览
        function closePreview(index) {
            const previewContainer = document.getElementById(`preview-container-${index}`);
            previewContainer.classList.remove('active');
        }

        // 下载文件
        function downloadFile(filePath, originalFilename) {
            if (!filePath) {
                alert('没有可下载的文件');
                return;
            }

            // Create the download URL with the file path and original filename
            const downloadUrl = `/api/feedback/file/download?path=${encodeURIComponent(filePath)}`;

            // Add the original filename if available
            const finalUrl = originalFilename ?
                `${downloadUrl}&filename=${encodeURIComponent(originalFilename)}` :
                downloadUrl;

            // Create a temporary link and trigger the download
            const link = document.createElement('a');
            link.href = finalUrl;
            link.target = '_blank';
            link.download = originalFilename || filePath.split('/').pop();
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 页面加载时获取反馈
        document.addEventListener('DOMContentLoaded', () => {
            loadFeedback();

            // 存储反馈数据以便后续使用
            fetch('/api/feedback')
                .then(response => response.json())
                .then(data => {
                    window.feedbackData = data;
                })
                .catch(error => console.error('Failed to cache feedback data:', error));
        });
    </script>
</body>
</html>
